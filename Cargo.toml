[package]
name = "moonup"
version = "0.6.1"
edition = "2024"
description = "Manage multiple MoonBit installations"
documentation = "https://docs.rs/moonup"
homepage = "https://github.com/chawyehsu/moonup"
repository = "https://github.com/chawyehsu/moonup"
license = "Apache-2.0"
keywords = ["moonbit", "version-manager"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5.65"
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
console = "0.16.1"
dialoguer = "0.12.0"
dirs = "6.0.0"
flate2 = "1.1.5"
futures-util = "0.3.31"
hex = "0.4.3"
indicatif = "0.18.4"
miette = { version = "7.6.0", features = ["fancy"] }
rattler_digest = "2.1.0"
remove_dir_all = "1.0.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
self_update = "0.44.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tar = "0.4.46"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.17", features = ["io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.8"
which = "8.0.0"
zip = "8.6.0"

[dev-dependencies]
assert_fs = "1.1.3"
insta = { version = "1.46.3", features = ["filters", "glob", "redactions", "yaml"] }
insta-cmd = "0.7.0"
mockito = "1.7.0"
predicates = "3.1.3"
serial_test = "3.5.0"
temp-env = "0.3.6"

# expectrl has some issues on Windows
# see: https://github.com/zhiburt/expectrl/issues/52
[target."cfg(not(windows))".dev-dependencies]
expectrl = "0.9.0"
regex = "1.12.2"

[target."cfg(windows)".dependencies]
junction = "2.0.0"

[features]
default = ["self_update"]
# Display the self-update subcommand in the --help output
self_update = []
# Test interactive commands that require TTY
test-interactive = []
# Extra tests that require network access to prod MOONUP_DIST_SERVER APIs,
# which may be flaky and slow, default is off
test-online = []

# https://insta.rs/docs/quickstart/#optional-faster-runs
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.release]
debug = false
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.release-debug]
inherits = "release"
debug = true
strip = false
