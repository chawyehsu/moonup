name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".vscode"
      - "*.md"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - ".vscode"
      - "*.md"
      - ".github/workflows/docs.yml"

permissions: {}

jobs:
  ci_style_check:
    # skip if it's a release commit
    if: "!contains(github.event.head_commit.message, 'chore(main): release')"
    name: Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for .snap.new files
        run: |
          if find . -name '*.snap.new' | grep -q .; then
            echo "::error::'.snap.new' files found. Run 'cargo insta review' to accept/reject snapshots."
            exit 1
          fi

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      - name: Format Check
        run: pixi run -e ci-check fmt -- --check

  ci_test_build:
    needs: ci_style_check
    strategy:
      matrix:
        include:
          - { os: "ubuntu-latest" }
          - { os: "ubuntu-24.04-arm" }
          - { os: "windows-latest" }
          - { os: "macos-latest" }
    name: Test and Build
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Expose GitHub Actions Cache Environment Variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      - name: Clippy Check
        run: pixi run -e ci-test clippy

      - name: Run Tests
        run: pixi run -e ci-test test

      - name: Build
        run: pixi run -e ci-test build
