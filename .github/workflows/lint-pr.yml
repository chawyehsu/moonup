name: Lint Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title
        uses: chawyehsu/actions/semantic-pr-title@39efbf77de6aa263da59da5e12ee36e2c1bb174e # v1.3.0
