name: Coverage

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".vscode"
      - "*.md"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - ".vscode"
      - "*.md"
      - ".github/workflows/docs.yml"

permissions: {}

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # skip if the commit message contains 'build(deps)', typically for dependabot
    if: "!contains(github.event.head_commit.message, 'build(deps)')"
    env:
      SCCACHE_GHA_ENABLED: true
      RUSTC_WRAPPER: sccache
      ACTIONS_CACHE_SERVICE_V2: on
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Expose GitHub Actions Cache Environment Variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false

      - name: Generate Coverage
        run: pixi run -e ci-coverage cargo llvm-cov --all-features --workspace --lcov --output-path lcov.out

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: lcov.out
          fail_ci_if_error: true
